services:
  # Backend API (Express)
  - type: web
    runtime: node
    name: editorial-workflow-api
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: JWT_SECRET
        sync: false # set this once in the dashboard; do not let Render auto-generate a new value on every deploy
      - key: JWT_EXPIRES_IN
        value: 1d
      - key: MONGODB_URI
        sync: false
      - key: CLIENT_URL
        sync: false # set to the static site's URL below, e.g. https://editorial-workflow.onrender.com

  # Frontend (Vite build served as a static site)
  - type: web
    runtime: static
    name: editorial-workflow-client
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false # set to the backend service's URL + /api, e.g. https://editorial-workflow-api.onrender.com/api
    routes:
      # React Router owns client-side routes like /dashboard; without this rule
      # a direct visit or refresh on any route other than "/" returns a 404,
      # because there's no real file at that path.
      - type: rewrite
        source: /*
        destination: /index.html